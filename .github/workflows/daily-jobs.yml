name: Daily Job Agent

on:
  schedule:
    # Run at 2:00 AM UTC daily (8:30 AM IST) — adjusted for cleaner scheduling
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install xml2js
        run: npm install xml2js

      - name: Install dependencies
        run: npm install

      - name: Clear job tracker
        run: echo '{"applied":[],"seen":[]}' > data/applied.json

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node main.js --no-ai

      - name: Rename report to consistent name
        run: |
          REPORT_FILE=$(ls -t output/report-*.html | head -1)
          cp "$REPORT_FILE" output/report-latest.html

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: output/report-latest.html
          retention-days: 7

      - name: Check secrets
        run: |
          echo "Checking secrets configuration..."
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "WARNING: RESEND_API_KEY is not set"
          else
            echo "RESEND_API_KEY is configured (hidden)"
          fi
          if [ -z "${{ secrets.EMAIL_TO }}" ]; then
            echo "WARNING: EMAIL_TO is not set"
          else
            echo "EMAIL_TO is configured (hidden)"
          fi

      - name: Send email with Resend API
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "RESEND_API_KEY not set, skipping email"
            exit 0
          fi

          if [ -z "${{ secrets.EMAIL_TO }}" ]; then
            echo "EMAIL_TO not set, skipping email"
            exit 0
          fi

          # Get the latest report file
          REPORT_FILE=$(ls -t output/report-*.html | head -1)
          echo "Report file: $REPORT_FILE"

          if [ -z "$REPORT_FILE" ]; then
            echo "No report file found"
            exit 0
          fi

          # Write payload using Python (avoids YAML heredoc issues and command-length limits)
          PAYLOAD_FILE=$(mktemp)
          export REPORT_FILE EMAIL_TO="${{ secrets.EMAIL_TO }}" PAYLOAD_FILE
          python3 << 'PYEOF'
import json, base64, os
with open(os.environ['REPORT_FILE'], 'rb') as f:
    b64 = base64.b64encode(f.read()).decode()
payload = {
    "from": "Job Agent <onboarding@resend.dev>",
    "to": [os.environ['EMAIL_TO']],
    "subject": "Daily GCP Jobs Report - " + __import__('datetime').datetime.now().strftime('%Y-%m-%d'),
    "html": "<p>Your daily GCP/Cloud job report is ready.</p><p>See attached HTML report.</p>",
    "attachments": [{"filename": "job-report.html", "content": b64}]
}
with open(os.environ['PAYLOAD_FILE'], 'w') as f:
    json.dump(payload, f)
PYEOF

          echo "Sending email via Resend (file payload)..."
          RESPONSE=$(curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data-binary @"$PAYLOAD_FILE")
          rm -f "$PAYLOAD_FILE" /tmp/attachment.b64
          echo "Response: $RESPONSE"
          echo "Email sent with attachment!"
