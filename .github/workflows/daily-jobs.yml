name: Daily Job Agent

on:
  schedule:
    # Run at 8:00 AM UTC daily (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  job-search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install xml2js
        run: npm install xml2js

      - name: Install dependencies
        run: npm install

      - name: Clear job tracker
        run: echo '{"applied":[],"seen":[]}' > data/applied.json

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node main.js --no-ai

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: output/report-*.html
          retention-days: 7

      - name: Send email with Resend API
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "RESEND_API_KEY not set, skipping email"
            exit 0
          fi

          # Get the latest report file
          REPORT_FILE=$(ls -t output/report-*.html | head -1)
          echo "Report file: $REPORT_FILE"

          if [ -z "$REPORT_FILE" ]; then
            echo "No report file found"
            exit 0
          fi

          # Convert HTML file to base64 for attachment
          BASE64_CONTENT=$(base64 -w 0 "$REPORT_FILE")

          echo "Sending email via Resend..."
          RESPONSE=$(curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"Job Agent <onboarding@resend.dev>\",
              \"to\": [\"${{ secrets.EMAIL_TO }}\"],
              \"subject\": \"Daily GCP Jobs Report - $(date +%Y-%m-%d)\",
              \"html\": \"<p>Your daily GCP/Cloud job report is ready.</p><p>See attached HTML report.</p>\",
              \"attachments\": [
                {
                  \"filename\": \"job-report.html\",
                  \"content\": \"$BASE64_CONTENT\"
                }
              ]
            }")
          echo "Response: $RESPONSE"
          echo "Email sent with attachment!"